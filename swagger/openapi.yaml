openapi: 3.0.0
info:
  title: Contacts API
  version: 1.0.0

servers:
  - url: https://hw7-cmo4.onrender.com
    description: Production server
  - url: http://localhost:3000
    description: Local server

paths:
  /contacts:
    get:
      $ref: './paths/get.yaml#/get'
    post:
      $ref: './paths/post.yaml#/post'

  /contacts/{contactId}:
    get:
      $ref: './paths/getID.yaml#/get'
    patch:
      $ref: './paths/patch.yaml#/patch'
    delete:
      $ref: './paths/delete.yaml#/delete'

components:
  schemas:
    contact:
      $ref: './schemas/contact.yaml'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT