tags:
  - Contacts
summary: Update contact by id
operationId: updateContact
description: 'Update a contact with payload'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '8e5d6ef5kf84hf73'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phone"
            type: string
            example: '+380000000000'
          email:
            description: "Contact's email"
            type: string
            example: 'john@gmail.com'
          photo:
            description: "Link to contact's photo"
            type: string
            format: binary
          isFavourite:
            description: 'Whether is contact favorite'
            type: boolean
            example: false
          contactType:
            description: "Contact's type"
            type: string
            example: 'work'
            enum: ['work', 'home', 'personal']
responses:
  '200':
    description: Update a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              $ref: '../schemas/contact.yaml'
  '400':
    $ref: '../errors/400.yaml'
  '401':
    $ref: '../errors/401.yaml'
  '404':
    $ref: '../errors/404.yaml'
  '500':
    $ref: '../errors/500.yaml'