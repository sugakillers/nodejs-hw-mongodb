tags:
  - Contacts
summary: Get contacts by id
operationId: getContact
description: 'Get contacts by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '8e5d6ef5kf84hf73'
responses:
  '200':
    description: 'Get contact by id'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact by id!
            data:
              $ref: '../schemas/contact.yaml'
  '400':
    $ref: '../errors/400.yaml'
  '401':
    $ref: '../errors/401.yaml'
  '404':
    $ref: '../errors/404.yaml'
  '500':
    $ref: '../errors/500.yaml'