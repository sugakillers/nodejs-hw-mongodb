openapi: 3.0.0
info:
  title: Contacts API
  version: 1.0.0
servers:
  - url: https://hw7-cmo4.onrender.com
    description: Production server
  - url: http://localhost:3000
    description: Local server
paths:
  /contacts:
    get:
      tags:
        - Contacts
      summary: Get list of contacts
      operationId: getContacts
      description: Get list of contacts with this endpoint
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            example: 1
        - in: query
          name: perPage
          schema:
            type: integer
            example: 10
        - in: query
          name: sortBy
          schema:
            type: string
            example: name
          description: All contacts's fields can be mentioned. Default value - _id
        - in: query
          name: sortOrder
          schema:
            type: string
            enum:
              - asc
              - desc
            example: asc
        - in: query
          name: contactType
          schema:
            type: string
            enum:
              - work
              - home
              - personal
            example: work
            description: Contact`s type
        - in: query
          name: isFavourite
          schema:
            type: boolean
            example: true
            description: Whether the contact is marked as a favorite
      responses:
        '200':
          description: Successfully found contacts
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                  - data
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully found contacts!
                  data:
                    type: object
                    required:
                      - data
                      - page
                      - perPage
                      - totalItems
                      - totalPages
                      - hasPreviousPage
                      - hasNextPage
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/contact'
                      page:
                        type: number
                        example: 2
                      perPage:
                        type: number
                        example: 4
                      totalItems:
                        type: number
                        example: 4
                      totalPages:
                        type: number
                        example: 4
                      hasNextPage:
                        type: boolean
                        example: false
                      hasPreviousPage:
                        type: boolean
                        example: true
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
    post:
      tags:
        - Contacts
      summary: Create contact
      operationId: createContact
      description: Create a contact with payload
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - phoneNumber
              properties:
                name:
                  description: Contact's name
                  type: string
                  example: John Doe
                phoneNumber:
                  description: Contact's phone
                  type: string
                  example: '+380000000000'
                email:
                  description: Contact's email
                  type: string
                  example: john@gmail.com
                photo:
                  description: Link to contact's photo
                  type: string
                  format: binary
                isFavourite:
                  description: Whether is contact favorite
                  type: boolean
                  example: false
                contactType:
                  description: Contact's type
                  type: string
                  example: work
                  enum:
                    - work
                    - home
                    - personal
      responses:
        '201':
          description: Creates a contact
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                  - data
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Successfully created a contact!
                  data:
                    $ref: '#/components/schemas/contact'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
  /contacts/{contactId}:
    get:
      tags:
        - Contacts
      summary: Get contacts by id
      operationId: getContact
      description: Get contacts by id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: contactId
          required: true
          schema:
            type: string
            example: 8e5d6ef5kf84hf73
      responses:
        '200':
          description: Get contact by id
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                  - data
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully found contact by id!
                  data:
                    $ref: '#/components/schemas/contact'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
    patch:
      tags:
        - Contacts
      summary: Update contact by id
      operationId: updateContact
      description: Update a contact with payload
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: contactId
          required: true
          schema:
            type: string
            example: 8e5d6ef5kf84hf73
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  description: Contact's name
                  type: string
                  example: John Doe
                phoneNumber:
                  description: Contact's phone
                  type: string
                  example: '+380000000000'
                email:
                  description: Contact's email
                  type: string
                  example: john@gmail.com
                photo:
                  description: Link to contact's photo
                  type: string
                  format: binary
                isFavourite:
                  description: Whether is contact favorite
                  type: boolean
                  example: false
                contactType:
                  description: Contact's type
                  type: string
                  example: work
                  enum:
                    - work
                    - home
                    - personal
      responses:
        '200':
          description: Update a contact
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                  - data
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Successfully patched a contact!
                  data:
                    $ref: '#/components/schemas/contact'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
    delete:
      tags:
        - Contacts
      summary: Delete contact by id
      operationId: deleteContact
      description: Delete a contact
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: contactId
          required: true
          schema:
            type: string
            example: 8e5d6ef5kf84hf73
      responses:
        '204':
          description: Delete a contact
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
components:
  schemas:
    contact:
      type: object
      required:
        - contactId
        - name
        - phoneNumber
        - userId
      properties:
        contactId:
          description: Contact's id
          type: string
          example: 8e5d6ef5kf84hf73
        name:
          description: Contact's name
          type: string
          example: John Doe
        phoneNumber:
          description: Contact's phone
          type: string
          example: '+380000000000'
        email:
          description: Contact's email
          type: string
          example: john@gmail.com
        photo:
          description: Link to contact's photo
          type: string
          example: https://res.cloudinary.com/prod/image/upload/ar_1:1,c_auto,g_auto,w_500/r_45/me/rc/animals-4.png
        isFavourite:
          description: Whether is contact favorite
          type: boolean
          example: false
        contactType:
          description: Contact's type
          type: string
          example: work
          enum:
            - work
            - home
            - personal
        userId:
          description: Contact's user id
          type: string
          example: john@gmail.com
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    '400':
      description: Bad Request. The provided contact ID is invalid.
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
              - data
            properties:
              status:
                type: integer
                example: 400
              message:
                type: string
                example: Invalid Id
              data:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: Invalid Id
    '401':
      description: Unauthorized error
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
              - data
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: UnauthorizedError
              data:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: Access token expired
    '404':
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
              - data
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: Route not found
              data:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: Contact not found
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
              - data
            properties:
              status:
                type: integer
                example: 500
              message:
                type: string
                example: An unexpected error occurred on the server.
              data:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: Internal Server Error
